<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Tech - Bulk Background Remover</title>
    <style>
        /* Modern UI Design */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #333; margin-bottom: 5px; }
        p.sub { color: #666; margin-bottom: 30px; }

        /* Drag & Drop Area */
        .upload-area {
            width: 100%;
            max-width: 800px;
            background: white;
            border: 2px dashed #3498db;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .upload-area:hover { background-color: #f0f8ff; border-color: #2980b9; }
        .upload-area h3 { margin: 10px 0; color: #2c3e50; }
        .upload-area p { color: #7f8c8d; font-size: 14px; }
        .icon { font-size: 50px; }

        /* Results Gallery (The Grid) */
        .gallery {
            width: 100%;
            max-width: 800px;
            margin-top: 30px;
        }

        /* Individual Card Design */
        .image-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 20px;
            animation: slideIn 0.4s ease;
        }

        /* Comparison Layout */
        .compare-box {
            display: flex;
            flex: 1;
            gap: 15px;
        }

        .img-container {
            flex: 1;
            height: 200px; /* Fixed height for consistency */
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #eee;
            position: relative;
            background: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Transparency Grid for Result */
        .transparency-bg {
            background-image: 
                linear-gradient(45deg, #ccc 25%, transparent 25%), 
                linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #ccc 75%), 
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .label {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 2px 8px;
            font-size: 10px;
            border-radius: 4px;
        }

        /* Status & Actions */
        .status-box {
            width: 150px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        .btn-dl {
            background: #27ae60;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 13px;
            margin-top: 5px;
            display: none; /* Hidden until ready */
        }
        
        .error-msg { color: #e74c3c; font-size: 12px; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <h1>Dream Tech Bulk Remover</h1>
    <p class="sub">Upload Unlimited Photos • Auto Process • Original Quality</p>

    <div class="upload-area" id="dropZone">
        <div class="icon">☁️</div>
        <h3>Drag & Drop Multiple Images</h3>
        <p>or Click to Select / Ctrl+V to Paste</p>
        <input type="file" id="fileInput" multiple accept="image/png, image/jpeg, image/jpg" style="display:none">
    </div>

    <div class="gallery" id="gallery"></div>

    <script>
        // ✅ API KEY SET
        const API_KEY = "iC3FnLD75AQ3haPREAJEHY5Z"; 

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const gallery = document.getElementById('gallery');

        // Events
        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
            fileInput.value = ''; // Reset for next batch
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.backgroundColor = '#f0f8ff';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.backgroundColor = 'white';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.backgroundColor = 'white';
            handleFiles(e.dataTransfer.files);
        });

        window.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            const files = [];
            for (let item of items) {
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    files.push(item.getAsFile());
                }
            }
            if(files.length > 0) handleFiles(files);
        });

        // 1. Handle Multiple Files Loop
        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    createCardAndProcess(file);
                }
            });
        }

        // 2. Create Card UI & Start Processing
        function createCardAndProcess(file) {
            // Generate Unique ID
            const id = Math.random().toString(36).substr(2, 9);
            const originalUrl = URL.createObjectURL(file);

            // Create HTML Structure for the Card
            const cardHTML = `
                <div class="image-card" id="card-${id}">
                    <div class="compare-box">
                        <div class="img-container">
                            <span class="label">Original</span>
                            <img src="${originalUrl}" alt="Original">
                        </div>
                        <div class="img-container transparency-bg">
                            <span class="label">No Background</span>
                            <img id="res-img-${id}" style="display:none">
                            <div id="loading-${id}" style="color:#999; font-size:12px;">Waiting...</div>
                        </div>
                    </div>
                    
                    <div class="status-box">
                        <div class="loader" id="loader-${id}"></div>
                        <span id="status-${id}" style="font-size:12px; font-weight:bold; color:#3498db">Processing...</span>
                        <a id="dl-${id}" class="btn-dl">Download ⬇️</a>
                    </div>
                </div>
            `;

            // Add to Gallery (Top)
            gallery.insertAdjacentHTML('afterbegin', cardHTML);

            // Call API
            processSingleImage(file, id);
        }

        // 3. API Logic
        async function processSingleImage(file, id) {
            const formData = new FormData();
            formData.append('image_file', file);
            formData.append('size', 'auto'); // Full Quality

            try {
                const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST',
                    headers: { 'X-Api-Key': API_KEY },
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    
                    // Update UI - Show Result
                    const resImg = document.getElementById(`res-img-${id}`);
                    const loadingText = document.getElementById(`loading-${id}`);
                    const loader = document.getElementById(`loader-${id}`);
                    const status = document.getElementById(`status-${id}`);
                    const dlBtn = document.getElementById(`dl-${id}`);

                    resImg.src = url;
                    resImg.style.display = 'block';
                    loadingText.style.display = 'none';
                    
                    loader.style.display = 'none';
                    status.textContent = "Done!";
                    status.style.color = "#27ae60";

                    // Setup Download Button
                    const newFileName = (file.name.split('.')[0] || "image") + "-nobg.png";
                    dlBtn.href = url;
                    dlBtn.download = newFileName;
                    dlBtn.style.display = 'inline-block';

                    // Auto Download Trigger
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = newFileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);

                } else {
                    const errorData = await response.json();
                    throw new Error(errorData.errors[0].title);
                }
            } catch (error) {
                document.getElementById(`loader-${id}`).style.display = 'none';
                const status = document.getElementById(`status-${id}`);
                status.textContent = "Failed";
                status.style.color = "#e74c3c";
                status.insertAdjacentHTML('beforeend', `<br><span class="error-msg">${error.message}</span>`);
            }
        }
    </script>
</body>
</html>
