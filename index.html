<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Background Remover</title>
    <style>
        /* वेबसाइट को सुंदर और Clean बनाने के लिए CSS */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
            max-width: 90%;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        /* Drag and Drop Zone का डिज़ाइन */
        .drop-zone {
            border: 3px dashed #a0a0a0;
            border-radius: 10px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #fafafa;
            position: relative;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: #4a90e2;
            background-color: #eef6ff;
        }

        .drop-zone p {
            font-size: 16px;
            color: #666;
            pointer-events: none; /* Text shouldn't interfere with drop */
        }

        .status {
            margin-top: 20px;
            font-weight: bold;
            min-height: 24px;
        }

        .status.loading { color: #e67e22; }
        .status.success { color: #27ae60; }
        .status.error { color: #e74c3c; }

        /* Spinner Animation */
        .spinner {
            display: none;
            width: 30px;
            height: 30px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Original Input को छुपाने के लिए */
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Auto Background Remover</h2>
        
        <div class="drop-zone" id="dropZone">
            <p>📁 Drag & Drop Photo Here</p>
            <p>OR</p>
            <p>📋 Paste (Ctrl+V)</p>
            <p style="font-size: 12px; color: #999;">(Click to Upload)</p>
            <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg">
        </div>

        <div class="spinner" id="spinner"></div>
        <div class="status" id="statusText">Ready</div>
    </div>

    <script>
        // ==========================================
        // यहाँ अपनी API KEY डालें
        const API_KEY = "YOUR_API_KEY_HERE"; 
        // ==========================================

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const statusText = document.getElementById('statusText');
        const spinner = document.getElementById('spinner');

        // 1. Click to Upload Event
        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processImage(e.target.files[0]);
            }
        });

        // 2. Drag and Drop Events
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            if (e.dataTransfer.files.length > 0) {
                processImage(e.dataTransfer.files[0]);
            }
        });

        // 3. Paste Event (Ctrl+V)
        window.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const blob = item.getAsFile();
                    processImage(blob);
                }
            }
        });

        // ==========================================
        // Main Logic: API Call & Auto Download
        // ==========================================
        async function processImage(file) {
            // Validation: Check if it's an image
            if (!file.type.startsWith('image/')) {
                showStatus("Please upload an image file (JPG/PNG)", "error");
                return;
            }

            if (API_KEY === "YOUR_API_KEY_HERE") {
                showStatus("Error: Please open the file and add your API Key in the code!", "error");
                alert("आपने कोड में अपनी API Key नहीं डाली है। कृपया कोड को edit करें।");
                return;
            }

            // Show Loading
            showStatus("Removing Background...", "loading");
            spinner.style.display = 'block';

            const formData = new FormData();
            formData.append('image_file', file);
            formData.append('size', 'auto');

            try {
                // Remove.bg API Call
                const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST',
                    headers: {
                        'X-Api-Key': API_KEY
                    },
                    body: formData
                });

                if (response.ok) {
                    // Success: Get image blob
                    const blob = await response.blob();
                    downloadImage(blob, file.name);
                    showStatus("Success! Downloading...", "success");
                } else {
                    // Error Handling
                    const errorData = await response.json();
                    showStatus("Error: " + (errorData.errors[0].title || "API Error"), "error");
                }

            } catch (error) {
                showStatus("Network Error: Check internet connection", "error");
                console.error(error);
            } finally {
                spinner.style.display = 'none';
                // Reset file input so same file can be selected again if needed
                fileInput.value = '';
            }
        }

        // Function to Auto Download
        function downloadImage(blob, originalName) {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            
            // Generate new filename (e.g., photo.jpg -> photo-no-bg.png)
            const namePart = originalName ? originalName.split('.')[0] : "image";
            a.download = `${namePart}-no-bg.png`;
            
            document.body.appendChild(a);
            a.click();
            
            // Clean up
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        function showStatus(msg, type) {
            statusText.textContent = msg;
            statusText.className = 'status ' + type;
        }
    </script>
</body>
</html>
