<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Tech - Unlimited BG Remover</title>
<style>
/* Dark Theme Design */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #050505;
    color: #ffffff;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

h1 {
    color: #ffffff;
    margin-bottom: 5px;
    font-weight: 300;
    letter-spacing: 1px;
}

p.sub {
    color: #00a8ff;
    margin-bottom: 30px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 0.9rem;
}

/* Drag & Drop Area */
.upload-area {
    width: 100%;
    max-width: 800px;
    background: #111;
    border: 2px dashed #333;
    border-radius: 15px;
    padding: 40px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
    position: relative;
    z-index: 10;
}

.upload-area.active {
    background-color: #1a1a1a;
    border-color: #00a8ff;
    transform: scale(1.02);
    box-shadow: 0 0 20px rgba(0, 168, 255, 0.2);
}

.upload-area h3 { margin: 10px 0; color: #eee; }
.upload-area p { color: #666; font-size: 14px; margin: 5px 0; }

kbd {
    background-color: #333;
    border-radius: 4px;
    border: 1px solid #444;
    padding: 4px 8px;
    font-family: monospace;
    color: #ddd;
}

/* Gallery & Cards */
.gallery {
    width: 100%;
    max-width: 800px;
    margin-top: 30px;
}

.image-card {
    background: #111;
    border: 1px solid #222;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    animation: slideIn 0.4s ease;
}

.compare-box {
    display: flex;
    flex: 1;
    gap: 15px;
}

.img-container {
    flex: 1;
    height: 200px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #333;
    position: relative;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
}

.transparency-bg {
    background-image:
    linear-gradient(45deg, #333 25%, transparent 25%),
    linear-gradient(-45deg, #333 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #333 75%),
    linear-gradient(-45deg, transparent 75%, #333 75%);
    background-size: 20px 20px;
    background-color: #1a1a1a;
}

.img-container img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.label {
    position: absolute;
    top: 5px;
    left: 5px;
    background: rgba(0,0,0,0.8);
    color: #aaa;
    padding: 2px 8px;
    font-size: 10px;
    border-radius: 4px;
}

/* Status & Loader */
.status-box {
    width: 150px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.loader {
    border: 3px solid #333;
    border-top: 3px solid #00a8ff;
    border-radius: 50%;
    width: 25px;
    height: 25px;
    animation: spin 1s linear infinite;
    margin-bottom: 10px;
}

.btn-dl {
    background: #00a8ff;
    color: white;
    text-decoration: none;
    padding: 8px 15px;
    border-radius: 5px;
    font-size: 13px;
    margin-top: 5px;
    display: none;
    transition: 0.2s;
    cursor: pointer;
}
.btn-dl:hover { background: #008ecc; }

/* Progress Bar for Model Loading */
#model-status {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #222;
    padding: 10px 20px;
    border-radius: 8px;
    border: 1px solid #333;
    font-size: 12px;
    color: #aaa;
    display: none;
    z-index: 1000;
}

@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<h1>Dream Tech AI</h1>
<p class="sub">Unlimited • Free • Private</p>

<div class="upload-area" id="dropZone">
    <div style="font-size: 50px; margin-bottom: 10px;">⚡</div>
    <h3>Drag & Drop Images</h3>
    <p>Unlimited Processing (Runs on your PC)</p>
    <p style="margin-top: 15px; color: #888;">
        <kbd>Ctrl</kbd> + <kbd>V</kbd>
    </p>
    <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
</div>

<div class="gallery" id="gallery"></div>
<div id="model-status">⚙️ Loading AI Model...</div>

<script type="module">
    import imglyRemoveBackground from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.3.0/+esm";

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const gallery = document.getElementById('gallery');
    const modelStatus = document.getElementById('model-status');

    // --- Core Logic ---
    async function processFiles(files) {
        Array.from(files).forEach(file => {
            if (file.type.startsWith('image/')) {
                createCardAndProcess(file);
            }
        });
    }

    function createCardAndProcess(file) {
        const id = Math.random().toString(36).substr(2, 9);
        const originalUrl = URL.createObjectURL(file);

        const cardHTML = `
        <div class="image-card" id="card-${id}">
            <div class="compare-box">
                <div class="img-container">
                    <span class="label">Original</span>
                    <img src="${originalUrl}">
                </div>
                <div class="img-container transparency-bg">
                    <span class="label">Result</span>
                    <img id="res-img-${id}" style="display:none">
                    <div id="loading-${id}" style="color:#666; font-size:12px;">Waiting...</div>
                </div>
            </div>
            <div class="status-box">
                <div class="loader" id="loader-${id}"></div>
                <span id="status-${id}" style="font-size:12px; font-weight:bold; color:#00a8ff">Processing...</span>
                <a id="dl-${id}" class="btn-dl">Download HD</a>
            </div>
        </div>
        `;
        gallery.insertAdjacentHTML('afterbegin', cardHTML);
        
        // Start processing immediately
        removeBg(file, id);
    }

    async function removeBg(file, id) {
        const statusEl = document.getElementById(`status-${id}`);
        const loader = document.getElementById(`loader-${id}`);
        const loadingText = document.getElementById(`loading-${id}`);
        const resImg = document.getElementById(`res-img-${id}`);
        const dlBtn = document.getElementById(`dl-${id}`);

        modelStatus.style.display = "block";
        modelStatus.innerText = "⚙️ AI Model Active (Downloading assets if first run...)";

        try {
            // The Magic Line: Runs locally in browser
            const blob = await imglyRemoveBackground(file);
            
            const url = URL.createObjectURL(blob);
            
            resImg.src = url;
            resImg.style.display = 'block';
            loadingText.style.display = 'none';
            loader.style.display = 'none';
            
            statusEl.textContent = "Done!";
            statusEl.style.color = "#27ae60";
            
            dlBtn.href = url;
            dlBtn.download = (file.name.split('.')[0] || "image") + "-dreamtech.png";
            dlBtn.style.display = 'inline-block';
            
            modelStatus.style.display = "none"; // Hide global status when done

        } catch (error) {
            console.error(error);
            loader.style.display = 'none';
            statusEl.textContent = "Error";
            statusEl.style.color = "red";
            loadingText.textContent = "Failed to load model";
        }
    }

    // --- Event Listeners ---
    dropZone.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => {
        processFiles(e.target.files);
        fileInput.value = ''; 
    });

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('active');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('active');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('active');
        if (e.dataTransfer.files.length > 0) processFiles(e.dataTransfer.files);
    });

    window.addEventListener('paste', (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        const files = [];
        for (let item of items) {
            if (item.kind === 'file' && item.type.startsWith('image/')) {
                files.push(item.getAsFile());
            }
        }
        if(files.length > 0) processFiles(files);
    });

</script>

</body>
</html>
