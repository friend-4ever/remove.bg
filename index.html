<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Tech - Background Remover</title>
    <style>
        /* वेबसाइट का डिज़ाइन */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 450px;
            max-width: 90%;
            border: 1px solid #ddd;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        p.subtitle {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        /* Drag and Drop Zone का स्टाइल */
        .drop-zone {
            border: 3px dashed #bdc3c7;
            border-radius: 15px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #f9f9f9;
            position: relative;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: #3498db;
            background-color: #ecf0f1;
            transform: scale(1.02);
        }

        .drop-zone p {
            font-size: 16px;
            color: #7f8c8d;
            margin: 5px 0;
            pointer-events: none;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
        }

        /* Status (Loading/Success) का डिज़ाइन */
        .status {
            margin-top: 25px;
            font-weight: 600;
            font-size: 1rem;
            min-height: 24px;
        }

        .status.loading { color: #e67e22; }
        .status.success { color: #27ae60; }
        .status.error { color: #c0392b; }

        /* लोडिंग गोल चक्का (Spinner) */
        .spinner {
            display: none;
            width: 35px;
            height: 35px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Auto Background Remover</h2>
        <p class="subtitle">Powered by Dream Tech</p>
        
        <div class="drop-zone" id="dropZone">
            <span class="icon">📂</span>
            <p><strong>Drag & Drop</strong> Photo Here</p>
            <p>or Paste (Ctrl+V)</p>
            <p style="font-size: 13px; color: #95a5a6; margin-top: 10px;">(Click to Browse)</p>
            <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg">
        </div>

        <div class="spinner" id="spinner"></div>
        <div class="status" id="statusText">Ready to Upload</div>
    </div>

    <script>
        // ==========================================
        // ✅ आपकी API KEY यहाँ सेट कर दी गई है
        const API_KEY = "iC3FnLD75AQ3haPREAJEHY5Z"; 
        // ==========================================

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const statusText = document.getElementById('statusText');
        const spinner = document.getElementById('spinner');

        // 1. क्लिक करने पर अपलोड
        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) processImage(e.target.files[0]);
        });

        // 2. ड्रैग और ड्रॉप हैंडलिंग
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) processImage(e.dataTransfer.files[0]);
        });

        // 3. पेस्ट (Ctrl+V) हैंडलिंग
        window.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    processImage(item.getAsFile());
                }
            }
        });

        // 4. फोटो प्रोसेस और डाउनलोड करने का फंक्शन
        async function processImage(file) {
            // चेक करें कि फाइल इमेज है या नहीं
            if (!file.type.startsWith('image/')) {
                showStatus("⚠️ Please upload a valid image (JPG/PNG)", "error");
                return;
            }

            showStatus("⏳ Removing Background...", "loading");
            spinner.style.display = 'block';

            const formData = new FormData();
            formData.append('image_file', file);
            formData.append('size', 'auto');

            try {
                // Remove.bg को फाइल भेजना
                const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST',
                    headers: { 'X-Api-Key': API_KEY },
                    body: formData
                });

                if (response.ok) {
                    // अगर सफल हुआ, तो इमेज डाउनलोड करें
                    const blob = await response.blob();
                    downloadImage(blob, file.name);
                    showStatus("✅ Done! Downloading...", "success");
                } else {
                    // अगर कोई एरर आया
                    const errorData = await response.json();
                    showStatus("❌ Error: " + (errorData.errors[0].title || "API Issue"), "error");
                    console.error(errorData);
                }
            } catch (error) {
                showStatus("❌ Network Error", "error");
                console.error(error);
            } finally {
                spinner.style.display = 'none';
                fileInput.value = ''; // रीसेट करें ताकि अगली फोटो डाल सकें
            }
        }

        // ऑटो डाउनलोड फंक्शन
        function downloadImage(blob, originalName) {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            
            // फाइल का नाम सेट करना (e.g. photo-dreamtech-nobg.png)
            const namePart = originalName ? originalName.split('.')[0] : "image";
            a.download = `${namePart}-dreamtech-nobg.png`;
            
            document.body.appendChild(a);
            a.click();
            
            // मेमोरी खाली करें
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        function showStatus(msg, type) {
            statusText.textContent = msg;
            statusText.className = 'status ' + type;
        }
    </script>
</body>
</html>
