<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Remove-Backround</title>

<style>

/* Dark Theme Design */

body {

font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

background-color: #050505; /* Deep Black */

color: #ffffff;

margin: 0;

padding: 20px;

display: flex;

flex-direction: column;

align-items: center;

min-height: 100vh;

}



h1 {

color: #ffffff;

margin-bottom: 5px;

font-weight: 300;

letter-spacing: 1px;

pointer-events: none;

}


p.sub {

color: #888;

margin-bottom: 30px;

font-weight: 600;

letter-spacing: 2px;

text-transform: uppercase;

font-size: 0.8rem;

pointer-events: none;

}



/* Drag & Drop Area */

.upload-area {

width: 100%;

max-width: 800px;

background: #111;

border: 2px dashed #333;

border-radius: 15px;

padding: 40px;

text-align: center;

cursor: pointer;

transition: 0.3s;

position: relative;

z-index: 10;

}



.upload-area.active {

background-color: #1a1a1a;

border-color: #00a8ff;

transform: scale(1.02);

box-shadow: 0 0 20px rgba(0, 168, 255, 0.2);

}



.upload-area h3 { margin: 10px 0; color: #eee; }

.upload-area p { color: #666; font-size: 14px; margin: 5px 0; }


/* Keyboard Key Style (Ctrl + V) */

kbd {

background-color: #333;

border-radius: 4px;

border: 1px solid #444;

box-shadow: 0 2px 0 #000;

color: #ddd;

display: inline-block;

font-size: 0.85em;

font-weight: 700;

line-height: 1;

padding: 4px 8px;

white-space: nowrap;

font-family: monospace;

margin: 0 2px;

}



.icon {

font-size: 60px;

margin-bottom: 10px;

filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));

}



/* Results Gallery */

.gallery {

width: 100%;

max-width: 800px;

margin-top: 30px;

z-index: 10;

}



/* Individual Card */

.image-card {

background: #111;

border: 1px solid #222;

border-radius: 12px;

padding: 15px;

margin-bottom: 20px;

display: flex;

align-items: center;

gap: 20px;

animation: slideIn 0.4s ease;

}



.compare-box {

display: flex;

flex: 1;

gap: 15px;

}



.img-container {

flex: 1;

height: 200px;

border-radius: 8px;

overflow: hidden;

border: 1px solid #333;

position: relative;

background: #222;

display: flex;

justify-content: center;

align-items: center;

}



.transparency-bg {

background-image:

linear-gradient(45deg, #333 25%, transparent 25%),

linear-gradient(-45deg, #333 25%, transparent 25%),

linear-gradient(45deg, transparent 75%, #333 75%),

linear-gradient(-45deg, transparent 75%, #333 75%);

background-size: 20px 20px;

background-position: 0 0, 0 10px, 10px -10px, -10px 0px;

background-color: #1a1a1a;

}



.img-container img {

max-width: 100%;

max-height: 100%;

object-fit: contain;

}



.label {

position: absolute;

top: 5px;

left: 5px;

background: rgba(0,0,0,0.8);

color: #aaa;

padding: 2px 8px;

font-size: 10px;

border-radius: 4px;

border: 1px solid #333;

}



/* Status & Actions */

.status-box {

width: 150px;

text-align: center;

display: flex;

flex-direction: column;

align-items: center;

justify-content: center;

}



.loader {

border: 3px solid #333;

border-top: 3px solid #00a8ff;

border-radius: 50%;

width: 25px;

height: 25px;

animation: spin 1s linear infinite;

margin-bottom: 10px;

}



.btn-dl {

background: #00a8ff;

color: white;

text-decoration: none;

padding: 8px 15px;

border-radius: 5px;

font-size: 13px;

margin-top: 5px;

display: none;

transition: 0.2s;

}


.btn-dl:hover { background: #008ecc; }

.error-msg { color: #e74c3c; font-size: 12px; }



/* Full Screen Overlay */

#dragOverlay {

position: fixed;

top: 0;

left: 0;

width: 100%;

height: 100%;

background: rgba(0, 168, 255, 0.1);

border: 4px dashed #00a8ff;

z-index: 999;

pointer-events: none;

display: none;

box-sizing: border-box;

}


#dragOverlay.show { display: block; }



@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

@keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

</style>

</head>

<body>



<div id="dragOverlay"></div>



<h1>Background Remover</h1>

<p class="sub">Dream Tech</p>



<div class="upload-area" id="dropZone">

<div class="icon">📂</div>

<h3>Drag & Drop</h3>

<p>Click to Browse</p>

<p style="margin-top: 15px; color: #888;">

<kbd>Ctrl</kbd> + <kbd>V</kbd>

</p>

<input type="file" id="fileInput" multiple accept="image/png, image/jpeg, image/jpg" style="display:none">

</div>



<div class="gallery" id="gallery"></div>



<script>

// ✅ API KEY

const API_KEY = "iC3FnLD75AQ3haPREAJEHY5Z";



const dropZone = document.getElementById('dropZone');

const fileInput = document.getElementById('fileInput');

const gallery = document.getElementById('gallery');

const dragOverlay = document.getElementById('dragOverlay');



// --- Full Screen Drag & Drop ---

window.addEventListener('dragover', (e) => {

e.preventDefault();

dragOverlay.classList.add('show');

dropZone.classList.add('active');

});



window.addEventListener('dragleave', (e) => {

if (e.clientX === 0 && e.clientY === 0) {

dragOverlay.classList.remove('show');

dropZone.classList.remove('active');

}

});



window.addEventListener('drop', (e) => {

e.preventDefault();

dragOverlay.classList.remove('show');

dropZone.classList.remove('active');

if (e.dataTransfer.files.length > 0) {

handleFiles(e.dataTransfer.files);

}

});



// --- Click & Paste ---

dropZone.addEventListener('click', () => fileInput.click());



fileInput.addEventListener('change', (e) => {

handleFiles(e.target.files);

fileInput.value = '';

});



window.addEventListener('paste', (e) => {

const items = (e.clipboardData || e.originalEvent.clipboardData).items;

const files = [];

for (let item of items) {

if (item.kind === 'file' && item.type.startsWith('image/')) {

files.push(item.getAsFile());

}

}

if(files.length > 0) handleFiles(files);

});



// --- Processing Logic ---

function handleFiles(files) {

Array.from(files).forEach(file => {

if (file.type.startsWith('image/')) {

createCardAndProcess(file);

}

});

}



function createCardAndProcess(file) {

const id = Math.random().toString(36).substr(2, 9);

const originalUrl = URL.createObjectURL(file);



const cardHTML = `

<div class="image-card" id="card-${id}">

<div class="compare-box">

<div class="img-container">

<span class="label">Original</span>

<img src="${originalUrl}" alt="Original">

</div>

<div class="img-container transparency-bg">

<span class="label">No Background</span>

<img id="res-img-${id}" style="display:none">

<div id="loading-${id}" style="color:#666; font-size:12px;">Waiting...</div>

</div>

</div>


<div class="status-box">

<div class="loader" id="loader-${id}"></div>

<span id="status-${id}" style="font-size:12px; font-weight:bold; color:#00a8ff">Processing...</span>

<a id="dl-${id}" class="btn-dl">Download ⬇️</a>

</div>

</div>

`;



gallery.insertAdjacentHTML('afterbegin', cardHTML);

processSingleImage(file, id);

}



async function processSingleImage(file, id) {

const formData = new FormData();

formData.append('image_file', file);

formData.append('size', 'auto');



try {

const response = await fetch('https://api.remove.bg/v1.0/removebg', {

method: 'POST',

headers: { 'X-Api-Key': API_KEY },

body: formData

});



if (response.ok) {

const blob = await response.blob();

const url = URL.createObjectURL(blob);


const resImg = document.getElementById(`res-img-${id}`);

const loadingText = document.getElementById(`loading-${id}`);

const loader = document.getElementById(`loader-${id}`);

const status = document.getElementById(`status-${id}`);

const dlBtn = document.getElementById(`dl-${id}`);



resImg.src = url;

resImg.style.display = 'block';

loadingText.style.display = 'none';


loader.style.display = 'none';

status.textContent = "Done!";

status.style.color = "#27ae60";



const newFileName = (file.name.split('.')[0] || "image") + "-nobg.png";

dlBtn.href = url;

dlBtn.download = newFileName;

dlBtn.style.display = 'inline-block';



const a = document.createElement('a');

a.style.display = 'none';

a.href = url;

a.download = newFileName;

document.body.appendChild(a);

a.click();

document.body.removeChild(a);



} else {

const errorData = await response.json();

throw new Error(errorData.errors[0].title);

}

} catch (error) {

document.getElementById(`loader-${id}`).style.display = 'none';

const status = document.getElementById(`status-${id}`);

status.textContent = "Failed";

status.style.color = "#e74c3c";

status.insertAdjacentHTML('beforeend', `<br><span class="error-msg">${error.message}</span>`);

}

}

</script>

</body>

</html>
